<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusTube</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
      </div>
      <h1>FocusTube</h1>
    </div>

    <div class="stats-section">
      <h2>Today's Stats</h2>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z"></path>
              <path d="M12 8v4l3 3"></path>
            </svg>
          </div>
          <div class="stat-content">
            <span class="stat-value" id="videos-hidden">0</span>
            <span class="stat-label">Videos Hidden</span>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M2.5 9h21l-1.5 12H3.5L2.5 9z"></path>
              <path d="M12 9v6"></path>
              <path d="M8 9h8"></path>
            </svg>
          </div>
          <div class="stat-content">
            <span class="stat-value" id="channels-blocked">0</span>
            <span class="stat-label">Channels Blocked</span>
          </div>
        </div>
      </div>
    </div>

    <div class="quick-access">
      <h2>Filters</h2>
      <div class="switch-group">
        <div class="switch-item">
          <span class="switch-label">Brain Rot</span>
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-brainrot">
            <span class="slider"></span>
          </label>
        </div>

        <div class="switch-item">
          <span class="switch-label">Green Screen</span>
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-greenscreen">
            <span class="slider"></span>
          </label>
        </div>

        <div class="switch-item">
          <span class="switch-label">AI-Generated</span>
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-ai">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="action-buttons">
      <button id="open-settings" class="primary-button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 5.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51L9.09 5A2 2 0 0 1 11 3h2a2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.82.33l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33H9.9a1.65 1.65 0 0 0-1 1.51L9 9.09A2 2 0 0 1 11 11h2a2 2 0 0 1 2-2h.09a1.65 1.65 0 0 0 1-1.51z"></path>
        </svg>
        Open Settings
      </button>

      <button id="reset-stats" class="secondary-button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0z"></path>
          <path d="M12 8v4l3 3m0-7a9 9 0 0 1 9 9"></path>
        </svg>
        Reset Statistics
      </button>
    </div>
  </div>

  <script src="popup.js" defer></script>
</body>
</html>
